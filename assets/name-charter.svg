<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 70" width="100%" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap');

      .name-text {
        font-family: 'Source Serif 4', 'Charter', 'Bitstream Charter', Georgia, serif;
        font-size: 48px;
        font-weight: 500;
        letter-spacing: 0.5px;
        fill: #1f2328;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      @media (prefers-color-scheme: dark) {
        .name-text {
          fill: #f0f6fc;
        }
      }
    </style>
  </defs>
